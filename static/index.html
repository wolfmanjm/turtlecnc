<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CNC dialogs</title>
<link rel="stylesheet" href="cnc-dialog.css">
</head>
<body class="cd-screen">

<div class="cd-backtitle"><span>CNC Job Setup</span><span>v1.0</span></div>

<p>Pick a job type:</p>

<div class="cd-buttons" style="justify-content:flex-start">
  <button class="cd-btn" data-job="rectangle">&lt; &nbsp;<span class="cd-hot">R</span>ectangle&nbsp; &gt;</button>
  <button class="cd-btn" data-job="circle">&lt; &nbsp;<span class="cd-hot">C</span>ircle&nbsp; &gt;</button>
  <button class="cd-btn" data-job="hole">&lt; &nbsp;<span class="cd-hot">H</span>ole&nbsp; &gt;</button>
</div>

<pre class="cd-output" id="out" aria-live="polite"></pre>
<pre class="cd-output" id="msgs" aria-live="polite"></pre>

<div class="cd-statusbar">Tab/Shift-Tab move &#183; Space selects &#183; Enter confirms &#183; Esc cancels</div>

<script src="cnc-dialog.js"></script>
<script>
/* ---- one spec per dialog; add or drop fields freely ---------------------- */

const mm = { type: "number", step: 0.001, min: 0, unit: "mm" };

const SPECS = {
  rectangle: {
    title: "Rectangle profile",
    blurb: "Stock and cutter values, then which side of the line to run.",
    fields: [
      { name: "jobname", label: "Job name", type: "text", value: "rectangle", maxlength: 40 },
      { name: "width",   label: "Width",         ...mm, value: 100 },
      { name: "length",  label: "Length",        ...mm, value: 150 },
      { name: "depth",   label: "Depth",         ...mm, value: 6 },
      { name: "tooldia", label: "Tool diameter", ...mm, value: 6.35, min: 0.001 },
      { name: "doc",     label: "Depth of cut",  ...mm, value: 1.5, min: 0.001,
        unit: "mm per pass" },
      { name: "side", label: "Cutter offset", type: "radio", value: "inside",
        options: [
          { value: "inside",  label: "Inside \u2014 cut within the boundary" },
          { value: "outside", label: "Outside \u2014 cut around the boundary" },
          { value: "laser",   label: "Laser \u2014 cut on the boundary" }
        ]}
    ]
  },

  hole: {
    title: "Drill Helical Hole",
    fields: [
      { name: "jobname", label: "Job name", type: "text", value: "hole" },
      { name: "holedia", label: "Hole diameter", ...mm, value: 5, min: 0.001 },
      { name: "depth",   label: "Depth",         ...mm, value: 12 },
      { name: "peck",    label: "Peck depth",    ...mm, value: 0 },
      { name: "laser",   label: "Laser", type: "check", value: false }
    ]
  },

  circle: {
    title: "Circle profile",
    fields: [
      { name: "jobname", label: "Job name",      type: "text", value: "circle" },
      { name: "width",   label: "Width",         ...mm, value: 200 },
      { name: "length",  label: "Length",        ...mm, value: 300 },
      { name: "stock",   label: "Stock to remove", ...mm, value: 0.8 },
      { name: "tooldia", label: "Tool diameter", ...mm, value: 50, min: 0.001 },
      { name: "stepover", label: "Stepover", type: "number", step: 1, min: 1, max: 100,
        value: 70, unit: "%" },
      { name: "climb", label: "Climb milling", type: "check", value: true }
    ]
  }
};

/* ---- open one and print what a shell script would read back ------------- */

const out = document.getElementById("out");
const msgs = document.getElementById("msgs");

document.querySelectorAll("[data-job]").forEach((btn) => {
  btn.addEventListener("click", async () => {
    const kind = btn.dataset.job;
    const values = await cncDialog(SPECS[kind]);


    if (values === null) {
      out.textContent = "exit status 1 (cancelled)";
      return;
    }

    // Send asynchronously to Go backend
    fetch('/api/dialog-result', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ kind: kind, values: values })
    })
    .then(response => response.text())
    .then(data => {console.log('Server response:', data); msgs.textContent = data; })
    .catch(err => {console.error('Error:', err); msgs.textContent = "Error: " + err; })

    /* debug data */
    const lines = Object.entries(values).map(([k, v]) => {
      const key = k.toUpperCase();
      if (typeof v === "boolean") return key + "=" + (v ? 1 : 0);
      if (typeof v === "number")  return key + "=" + v;
      return key + '="' + v + '"';
    });

    out.textContent = "# " + kind + "\n" + lines.join("\n");
  });
});
</script>
</body>
</html>
