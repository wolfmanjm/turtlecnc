<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CNC dialogs</title>
<link rel="stylesheet" href="cnc-dialog.css">
</head>
<body class="cd-screen">

<div class="cd-backtitle"><span>CNC Job Setup</span><span>v1.0</span></div>

<p>Pick a job type:</p>

<div class="cd-buttons" style="justify-content:flex-start">
  <button class="cd-btn" data-job="rectangle">&lt; &nbsp;<span class="cd-hot">R</span>ectangle&nbsp; &gt;</button>
  <button class="cd-btn" data-job="circle">&lt; &nbsp;<span class="cd-hot">C</span>ircle&nbsp; &gt;</button>
  <button class="cd-btn" data-job="hole">&lt; &nbsp;<span class="cd-hot">H</span>ole&nbsp; &gt;</button>
  <button class="cd-btn" data-job="sidemill">&lt; &nbsp;<span class="cd-hot">S</span>ide Mill&nbsp; &gt;</button>
  <button class="cd-btn" data-job="squaring">&lt; &nbsp;<span class="cd-hot">S</span>quaring&nbsp; &gt;</button>
  <button class="cd-btn" data-job="pocket">&lt; &nbsp;<span class="cd-hot">P</span>ocket&nbsp; &gt;</button>
</div>

<pre class="cd-output" id="msgs" aria-live="polite"></pre>
<div class="cd-statusbar">Tab/Shift-Tab move &#183; Space selects &#183; Enter confirms &#183; Esc cancels</div>

<p>Resulting GCode (You can click the Copy button to copy it the clipboard then paste it into your MDI):</p>

<textarea class="gcoderesult" id="gcoderesult">
</textarea>
<br><br>
<input type="text" id="filenameInput" placeholder="Enter filename" value="my-text-file">
<span>.nc</span>
<button onclick="savegcode()">Save to File</button>
<button onclick="copygcode()">Copy GCode</button>
<hr>
<pre class="cd-output" id="out" aria-live="polite"></pre>

<script src="cnc-dialog.js"></script>
<script>
/* ---- one spec per dialog; add or drop fields freely ---------------------- */

const mm = { type: "number", step: 0.001, min: 0, unit: "mm" };

const SPECS = {
  rectangle: {
    title: "Rectangle profile",
    blurb: "Stock and cutter values, mill type inside/outside/laser.",
    fields: [
      { name: "jobname", label: "Job name", type: "text", value: "rectangle", maxlength: 40 },
      { name: "width",   label: "Width",         ...mm, value: 100 },
      { name: "length",  label: "Length",        ...mm, value: 150 },
      { name: "depth",   label: "Depth",         ...mm, value: 6 },
      { name: "tooldia", label: "Tool diameter", ...mm, value: 6.35, min: 0.001 },
      { name: "doc",     label: "Depth of cut",  ...mm, value: 1.5, min: 0.001, unit: "mm per pass" },
      { name: "feedrate",label: "Feedrate",      type: "number", value: 1400, unit: "mm/min"},
      { name: "rpm",     label: "Spindle",       type: "number", value: 0, unit: "RPM"},
      { name: "side",    label: "Cutter offset", type: "radio", value: "inside",
        options: [
          { value: "inside",  label: "Inside \u2014 cut within the boundary" },
          { value: "outside", label: "Outside \u2014 cut around the boundary" },
          { value: "laser",   label: "Laser \u2014 cut on the boundary" }
        ]}
    ]
  },

  hole: {
    title: "Drill Helical Hole",
    blurb: "Stock and cutter values, drills a helical hole with an endmill to the given depth",
    fields: [
      { name: "jobname", label: "Job name", type: "text", value: "hole" },
      { name: "diameter", label: "Hole diameter", ...mm, value: 10, min: 0.001 },
      { name: "depth",   label: "Depth",         ...mm, value: 12 },
      { name: "doc",     label: "Depth of cut",  ...mm, value: 1.5, min: 0.001, unit: "mm per pass" },
      { name: "tooldia", label: "Tool diameter", ...mm, value: 6.35, min: 0.001 },
      { name: "feedrate",label: "Feedrate",      type: "number", value: 1400, unit: "mm/min"},
      { name: "peck",    label: "Peck depth",    ...mm, value: 0 },
      { name: "rpm",     label: "Spindle",       type: "number", value: 0, unit: "RPM"},
      { name: "laser",   label: "Laser", type: "check", value: false }
    ]
  },

  circle: {
    title: "Circle profile",
    blurb: "Stock and cutter values, profiles a circle to the given depth, segments is optional",
    fields: [
      { name: "jobname", label: "Job name", type: "text", value: "circle", maxlength: 40 },
      { name: "diameter",   label: "Diameter",   ...mm, value: 20 },
      { name: "depth",   label: "Depth",         ...mm, value: 6 },
      { name: "tooldia", label: "Tool diameter", ...mm, value: 6.35, min: 0.001 },
      { name: "doc",     label: "Depth of cut",  ...mm, value: 1.5, min: 0.001, unit: "mm per pass" },
      { name: "feedrate",label: "Feedrate",      type: "number", value: 1400, unit: "mm/min"},
      { name: "rpm",     label: "Spindle",       type: "number", value: 0, unit: "RPM"},
      { name: "stepover",label: "Segments",      type: "number", value: 0, unit: "leave at 0 for auto"},
      { name: "side",    label: "Cutter offset", type: "radio", value: "inside",
        options: [
          { value: "inside",  label: "Inside \u2014 cut within the boundary" },
          { value: "outside", label: "Outside \u2014 cut around the boundary" },
          { value: "laser",   label: "Laser \u2014 cut on the boundary" }
        ]}
    ]
  },

  milltop: {
    title: "Mill a surface flat",
    blurb: "Starts at current position and z height and mills over the given width, length to given depth",

    fields: [
      { name: "jobname", label: "Job name",      type: "text", value: "surface" },
      { name: "width",   label: "Width",         ...mm, value: 200 },
      { name: "length",  label: "Length",        ...mm, value: 300 },
      { name: "depth",   label: "Depth",         ...mm, value: 1 },
      { name: "tooldia", label: "Tool diameter", ...mm, value: 50, min: 0.001 },
      { name: "feedrate",label: "Feedrate",      type: "number", value: 1400, unit: "mm/min"},
      { name: "stepover", label: "Stepover", type: "number", step: 1, min: 1, max: 100, value: 40, unit: "%" },
    ]
  },

  squaring: {
    title: "Square some stock",
    blurb: "Square up stock given width and length does top surface, given height will also do sides using a sidecut. depth is final depth of top surface, leave at 0 to just skim by DOC",

    fields: [
      { name: "jobname", label: "Job name",      type: "text", value: "squaring" },
      { name: "width",   label: "Width",         ...mm, value: 200 },
      { name: "length",  label: "Length",        ...mm, value: 300 },
      { name: "height",  label: "Height",        ...mm, value: 0 },
      { name: "doc",     label: "Depth of cut",  ...mm, value: 0.1, min: 0.001, unit: "mm per pass" },
      { name: "depth",   label: "Depth",         ...mm, value: 0 },
      { name: "tooldia", label: "Tool diameter", ...mm, value: 12, min: 0.001 },
      { name: "feedrate",label: "Feedrate",      type: "number", value: 1400, unit: "mm/min"},
      { name: "stepover", label: "Stepover", type: "number", step: 1, min: 1, max: 100, value: 40, unit: "%" },
      { name: "rpm",     label: "Spindle",       type: "number", value: 0, unit: "RPM"},
    ]
  },

  pocket: {
    title: "Cut a pocket into some stock",
    blurb: "Cut a rectangular pocket into the top of stock",

    fields: [
      { name: "jobname", label: "Job name",      type: "text", value: "pocket" },
      { name: "width",   label: "Width",         ...mm, value: 200 },
      { name: "length",  label: "Length",        ...mm, value: 300 },
      { name: "doc",     label: "Depth of cut",  ...mm, value: 0.1, min: 0.001, unit: "mm per pass" },
      { name: "depth",   label: "Depth",         ...mm, value: 0 },
      { name: "tooldia", label: "Tool diameter", ...mm, value: 12, min: 0.001 },
      { name: "feedrate",label: "Feedrate",      type: "number", value: 1400, unit: "mm/min"},
      { name: "plungerate",label: "Plungerate",  type: "number", value: 100, unit: "mm/min"},
      { name: "stepover", label: "Stepover", type: "number", step: 1, min: 1, max: 100, value: 40, unit: "%" },
      { name: "rpm",     label: "Spindle",       type: "number", value: 0, unit: "RPM"},
      { name: "spiral",  label: "Spiral path",   type: "check", value: false },
    ]
  },

  sidemill: {
    title: "Side mill an edge",
    blurb: "Starts at current position and z height and side mills over the given width to given depth using specified depth of cut",

    fields: [
      { name: "jobname", label: "Job name",      type: "text", value: "sidemill" },
      { name: "length",  label: "Length",        ...mm, value: 300 },
      { name: "depth",   label: "Depth",         ...mm, value: 1 },
      { name: "doc",     label: "Depth of cut",  ...mm, value: 0.5, min: 0.001, unit: "mm per pass" },

      { name: "side",    label: "Edge to mill", type: "radio", value: "bottom",
        options: [
          { value: "bottom",  label: "Mill the Bottom edge" },
          { value: "top", label: "Mill the top edge" },
          { value: "left",   label: "Mill the left edge" },
          { value: "right",   label: "Mill the right edge" },
        ]},

      { name: "tooldia", label: "Tool diameter", ...mm, value: 12, min: 0.001 },
      { name: "feedrate",label: "Feedrate",      type: "number", value: 1400, unit: "mm/min"},
      { name: "rpm",     label: "Spindle",       type: "number", value: 0, unit: "RPM"},
      { name: "conventional", label: "Conventional milling", type: "check", value: false }
    ]
  }
};

/* ---- open one and print what a shell script would read back ------------- */

const out = document.getElementById("out");
const msgs = document.getElementById("msgs");
const myGCode = document.getElementById("gcoderesult");

document.querySelectorAll("[data-job]").forEach((btn) => {
  btn.addEventListener("click", async () => {
    const kind = btn.dataset.job;
    const values = await cncDialog(SPECS[kind]);

    if (values === null) {
      out.textContent = "exit status 1 (cancelled)";
      return;
    }

    values['kind'] = kind

    // Send asynchronously to Go backend
    fetch('/api/dialog-result', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(values)
    })
    .then((response) => {
        if (!response.ok) {
          throw new Error(`HTTP error, status = ${response.status}`);
        }
        return response.text();
    })
    .then((text) => {
        myGCode.value = text;
    })
    .catch((error) => {
        msgs.textContent = `Error: ${error.message}`;
    });

    // set filename
	document.getElementById('filenameInput').value = values['jobname']

    /* debug data */
    const lines = Object.entries(values).map(([k, v]) => {
      const key = k.toUpperCase();
      if (typeof v === "boolean") return key + "=" + (v ? 1 : 0);
      if (typeof v === "number")  return key + "=" + v;
      return key + '="' + v + '"';
    });

    out.textContent = "# " + kind + "\n" + lines.join("\n");
  });
});

function copygcode() {
  // Get the text field
  navigator.clipboard.writeText(myGCode.value)
  msgs.textContent = "GCode copied to clipboard"
}

function savegcode() {
  const textContent = myGCode.value;
  const blob = new Blob([textContent], { type: 'text/plain' });
  const anchor = document.createElement('a');
  anchor.href = URL.createObjectURL(blob);

  let filename = document.getElementById('filenameInput').value.trim();
  if (!filename) {
    filename = 'gcode';
  }

  anchor.download = `${filename}.nc`;
  anchor.click();
  URL.revokeObjectURL(anchor.href);
  msgs.textContent = "GCode saved to file"
}

</script>
</body>
</html>
